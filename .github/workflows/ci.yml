name: ci

on:
  pull_request:
  push:
    branches: [develop, main]

# Pull requests, including from forks, run with a read-only token and no secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      # mypy also checks the contract client, the fixtures and the tests of the service.
      - run: python -m pip install -e ".[viz]" --group lint --group services/api/pyproject.toml:lint
      - run: ruff check
      - run: ruff format --check
      - run: mypy

  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[viz]" --group test
      - run: pytest

  # The contract of the service: the OpenAPI document, the fixtures and the contract
  # client agree, and the reference results are still those of the engine.
  service-contract:
    name: service contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[blocks]" --group services/api/pyproject.toml:test
      - name: Check that the fixtures are those the engine computes
        run: python services/api/contract/make_fixtures.py --check
      - run: pytest services/api/tests

  # The core and the ordinal family must live without NumPy.
  test-core:
    name: test without extras
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . --group test
      - name: Check that NumPy is not installed
        run: python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('numpy') is not None)"
      - run: pytest -m "not blocks"

  build:
    name: build and clean install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Install the wheel and the sdist in fresh environments
        run: |
          expected="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          for dist in dist/*.whl dist/*.tar.gz; do
            env_dir="$(mktemp -d)"
            python -m venv "$env_dir"
            "$env_dir/bin/python" -m pip install --quiet "$dist"
            (cd "$env_dir" && "$env_dir/bin/python" -c "import civiqhub_selene as m; assert m.__version__ == '$expected', m.__version__; print('$dist ->', m.__version__)")
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7

  # The site is built with warnings as errors: a broken link, a reference to a name that
  # does not exist or a page outside every table of contents fails the job. It is built
  # by the script that publishes it (docs.yml), from this commit alone: this clone holds
  # no other branch and no tag, so no other version is built.
  docs:
    name: documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python .github/scripts/build-docs-site.py --output _site --development HEAD
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-html
          path: _site/
          retention-days: 7

  dco:
    name: dco
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check Signed-off-by on every commit
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: bash .github/scripts/check-dco.sh "$BASE" "$HEAD"
