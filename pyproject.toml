[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "civiqhub-selene"
version = "0.0.1"
description = "SELENE, the open scientific engine of CiviqHub. Early scaffold, not functional yet."
readme = "README.md"
requires-python = ">=3.11"
# SPDX expression (PEP 639). It replaces the deprecated "License ::" classifiers,
# which PyPI refuses alongside it.
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "CiviqHub SAS", email = "contact@civiqhub.com" }]
keywords = ["civiqhub", "selene", "collective decision", "deliberation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: Sociology",
  "Typing :: Typed",
]
dependencies = []

# Reserved extras, one per engine area. Each stays empty until the first tested
# implementation of that area needs a dependency (see CONTRIBUTING.md).
[project.optional-dependencies]
ordinal = []
semantic = []
landscape = []

[project.urls]
Homepage = "https://civiqhub.com"
Source = "https://github.com/civiqhub/civiqhub-selene"
Issues = "https://github.com/civiqhub/civiqhub-selene/issues"
Changelog = "https://github.com/civiqhub/civiqhub-selene/blob/main/CHANGELOG.md"

[dependency-groups]
test = ["pytest>=9.1"]
# mypy also checks the tests, so it needs pytest.
lint = [{ include-group = "test" }, "ruff==0.17.2", "mypy==2.4.0"]
dev = [{ include-group = "lint" }, "build>=1.6", "twine>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/civiqhub_selene"]

# The service wrapper, CI and docs stay out of the scientific package.
[tool.hatch.build.targets.sdist]
include = [
  "/src/civiqhub_selene",
  "/tests",
  "/CHANGELOG.md",
  "/CITATION.cff",
  "/README.md",
]

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers", "-ra"]
xfail_strict = true
filterwarnings = ["error"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "services/api/src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "PT", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "services/api/src", "tests", ".github/scripts/check-version.py"]
mypy_path = ["src", "services/api/src"]
explicit_package_bases = true
