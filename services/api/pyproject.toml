# HTTP wrapper of the SELENE engine, packaged into the service image only.
# It is not a second library: "Private :: Do Not Upload" makes PyPI reject it.

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "selene-api"
version = "0.0.1"
description = "HTTP service wrapper of the SELENE engine. Early scaffold, not functional yet."
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "CiviqHub SAS", email = "contact@civiqhub.com" }]
classifiers = ["Private :: Do Not Upload"]
# The image installs the engine wheel built by the release CI, at the same version.
# Server dependencies are added with the first implementation, and locked.
dependencies = ["civiqhub-selene==0.0.1"]

[dependency-groups]
# Contract tests: the OpenAPI document, the fixtures and the contract client agree.
# PyYAML and jsonschema are MIT; openapi-spec-validator is Apache-2.0. Test tools only.
test = ["pytest>=9.1", "pyyaml>=6.0", "jsonschema>=4.23", "openapi-spec-validator>=0.7"]
# Stubs for mypy, which the root lint group installs. Both are Apache-2.0.
lint = [{ include-group = "test" }, "types-PyYAML", "types-jsonschema"]

[tool.hatch.build.targets.wheel]
packages = ["src/selene_api"]
