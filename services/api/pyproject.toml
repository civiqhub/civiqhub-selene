# HTTP wrapper of the SELENE engine, packaged into the service image only.
# It is not a second library: "Private :: Do Not Upload" makes PyPI reject it.

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "selene-api"
version = "0.1.0"
description = "HTTP service of the SELENE engine: contract v1, volatile jobs, supervised computations."
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "CiviqHub SAS", email = "contact@civiqhub.com" }]
classifiers = ["Private :: Do Not Upload"]
# The engine is never resolved from an index for the service: the image installs the
# wheel built from the same commit, verified by its SHA-256, and CI installs the engine of
# the same checkout. The lower bound only documents the oldest engine the adapters know.
# Server dependencies are locked with hashes in requirements.lock (see requirements.in).
# Starlette and Uvicorn are BSD-3-Clause, Pydantic is MIT.
dependencies = [
  "civiqhub-selene[blocks]>=0.1.0.dev0",
  "starlette>=1.10",
  "uvicorn>=0.54",
  "pydantic>=2.14",
]

[dependency-groups]
# Contract tests: the OpenAPI document, the fixtures and the contract client agree.
# PyYAML and jsonschema are MIT; openapi-spec-validator is Apache-2.0. Test tools only.
# HTTPX (BSD-3-Clause) drives the application in process; packaging (Apache-2.0 or
# BSD-2-Clause) reads the lock.
test = [
  "pytest>=9.1",
  "packaging>=24",
  "pyyaml>=6.0",
  "jsonschema>=4.23",
  "openapi-spec-validator>=0.7",
  "httpx>=0.28",
]
# Stubs for mypy, which the root lint group installs. Both are Apache-2.0.
lint = [{ include-group = "test" }, "types-PyYAML", "types-jsonschema"]

[tool.hatch.build.targets.wheel]
packages = ["src/selene_api"]
